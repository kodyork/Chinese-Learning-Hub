<!-- Header -->
  <header class="bg-neutral-950 text-white border-b border-neutral-800 sticky top-0 z-50 shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <span class="bg-rose-600 text-white font-bold text-lg px-2.5 py-0.5 rounded shadow-sm">学</span>
        <div>
          <h1 class="font-bold text-lg leading-none tracking-wide">学中文！ Chinese Hub</h1>
        </div>
      </div>
      
      <!-- Week & Day Selector -->
      <div class="flex items-center space-x-2 bg-neutral-900 p-1.5 rounded-xl border border-neutral-800">
        <select id="week-select" onchange="changeWeek(this.value)" class="bg-neutral-800 text-rose-400 text-xs font-bold px-3 py-1.5 rounded-lg border border-neutral-700 focus:outline-none cursor-pointer">
          <option value="1">Week 1 (Day 1 - 7)</option>
          <option value="2">Week 2 (Day 8 - 14)</option>
        </select>
        
        <div id="day-buttons" class="flex items-center space-x-1 overflow-x-auto max-w-xs sm:max-w-none"></div>
      </div>
    </div>
  </header>

  <!-- Dynamic Main Content -->
  <div id="app-root" class="flex-1"></div>

  <!-- Footer -->
  <footer class="bg-neutral-950 text-neutral-400 py-8 text-center text-xs border-t border-neutral-800">
    <p>© kodyyork 2026</p>
  </footer>
