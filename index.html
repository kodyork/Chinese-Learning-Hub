<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Times New Roman", "Noto Serif JP", YuMincho, "Hiragino Mincho ProN", serif;
    }
    .hover-lift {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);

    .hover-lift:hover {
      transform: translateY(-2px);

</head>
<body class="bg-neutral-50 text-neutral-900 antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-neutral-950 text-white border-b border-neutral-800 sticky top-0 z-50 shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="switchDay(currentActiveDay)">
        <span class="bg-rose-600 text-white font-bold text-lg px-2.5 py-0.5 rounded shadow-sm">学</span>
        <div>
          <h1 class="font-bold text-lg leading-none tracking-wide">学中文！ Chinese Hub</h1>
        </div>
      </div>
      
      <!-- Week & Day Selector & About Navigation -->
      <div class="flex flex-wrap items-center justify-center gap-2">
        <div class="flex items-center space-x-2 bg-neutral-900 p-1.5 rounded-xl border border-neutral-800">
          <select id="week-select" onchange="changeWeek(this.value)" class="bg-neutral-800 text-rose-400 text-xs font-bold px-3 py-1.5 rounded-lg border border-neutral-700 focus:outline-none cursor-pointer">
            <option value="1">Week 1 (Day 1 - 7)</option>
            <option value="2">Week 2 (Day 8 - 14)</option>
            <option value="3">Week 3 (Day 15 - 21)</option>
          </select>
          
          <div id="day-buttons" class="flex items-center space-x-1 overflow-x-auto max-w-xs sm:max-w-none"></div>
        </div>

        <button onclick="showAboutPage()" id="btn-about" class="px-3.5 py-2 rounded-xl text-xs font-bold transition cursor-pointer border border-neutral-800 bg-neutral-900 text-neutral-300 hover:text-white hover:border-neutral-700 flex items-center space-x-1.5">
          <i data-lucide="user" class="w-3.5 h-3.5 text-rose-500"></i>
          <span>About</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Dynamic Main Content -->
  <div id="app-root" class="flex-1"></div>

  <!-- Footer -->
  <footer class="bg-neutral-950 text-neutral-400 py-8 text-center text-xs border-t border-neutral-800">
    <div class="max-w-5xl mx-auto px-4 space-y-3">
      <p>© kodyork 2026</p>
      <div class="flex justify-center space-x-4 text-neutral-500">
        <button onclick="switchDay(currentActiveDay)" class="hover:text-rose-400 transition">Lessons</button>
        <span>•</span>
        <button onclick="showAboutPage()" class="hover:text-rose-400 transition">About Admin</button>
      </div>
    </div>
  </footer>

  <!-- Lesson Data Definitions -->
  <script>

    // Day 18 Data
    const day18Data = {
      render: function() {

            <div class="max-w-4xl mx-auto relative z-10">

                Day 18: 感情・気持ちの表現 ＆ 觉得 / 有点儿 / 状態補語「得」
              </h2>
            </div>
          </section>

      }
    };

    // Day 19 Data
    const day19Data = {
      render: function() {
        return `
          <section class="bg-neutral-950 text-white py-12 px-4 border-b border-neutral-800 relative overflow-hidden">
            <div class="max-w-4xl mx-auto relative z-10">
              <h2 class="text-3xl sm:text-4xl font-bold tracking-tight mb-4 text-neutral-100">

              <p class="text-sm text-neutral-700">你去过中国吗？(中国に行ったことがありますか？)</p>
            </div>

        `;
      }
    };

    // Day 20 Data
    const day20Data = {
      render: function() {
        return `
          <section class="bg-neutral-950 text-white py-12 px-4 border-b border-neutral-800 relative overflow-hidden">
            <div class="max-w-4xl mx-auto relative z-10">
              <h2 class="text-3xl sm:text-4xl font-bold tracking-tight mb-4 text-neutral-100">
                Day 20: 仮定・相談 ＆ 如果…就… / 最好 / 可不可以

            </div>

            <div class="bg-white border border-neutral-200/80 rounded-xl p-6 shadow-sm space-y-4">

    // Day 21 Data
    const day21Data = {
      render: function() {
        return `
          <section class="bg-neutral-950 text-white py-12 px-4 border-b border-neutral-800 relative overflow-hidden">
            <div class="max-w-4xl mx-auto relative z-10">
              <h2 class="text-3xl sm:text-4xl font-bold tracking-tight mb-4 text-neutral-100">
                Day 21: Week 3 総合復習 ＆ 21日完走記念テスト
              </h2>
            </div>
          </section>
          <main class="max-w-4xl mx-auto px-4 py-10 space-y-12">
            <div class="bg-white border border-neutral-200/80 rounded-xl p-6 shadow-sm space-y-4">
              <h3 class="text-xl font-bold text-neutral-900">1. 完走おめでとうございます！</h3>
              <p class="text-sm text-neutral-700">全21日間のカリキュラムを無事に修了しました。</p>
            </div>
          </main>
        `;
      }
    };
  </script>

  <!-- Controller Logic -->
  <script>
    let currentSpeed = 0.75;
    let currentActiveDay = 1;
    let currentActiveWeek = 1;

    function changeWeek(weekNum) {
      currentActiveWeek = parseInt(weekNum);
      const startDay = (currentActiveWeek - 1) * 7 + 1;
      renderDayButtons(startDay);
      switchDay(startDay);
    }

    function renderDayButtons(startDay) {
      const container = document.getElementById('day-buttons');
      container.innerHTML = '';

      for (let i = startDay; i < startDay + 7; i++) {
        const dayStr = i < 10 ? `0${i}` : `${i}`;
        const btn = document.createElement('button');
        btn.id = `btn-day${i}`;
        btn.onclick = () => switchDay(i);
        btn.innerText = `D${dayStr}`;
        btn.className = "px-2.5 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer shrink-0 text-neutral-400 hover:text-white";
        container.appendChild(btn);
      }
    }

    function setSpeed(speed) {
      currentSpeed = speed;
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        setTimeout(() => {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'zh-CN';
          utterance.rate = parseFloat(currentSpeed);
          window.speechSynthesis.speak(utterance);
        }, 50);
      }
    }

    function switchDay(dayNum) {
      currentActiveDay = dayNum;

      const btnAbout = document.getElementById('btn-about');
      if (btnAbout) {
        btnAbout.className = "px-3.5 py-2 rounded-xl text-xs font-bold transition cursor-pointer border border-neutral-800 bg-neutral-900 text-neutral-300 hover:text-white hover:border-neutral-700 flex items-center space-x-1.5";
      }

      const startDay = (currentActiveWeek - 1) * 7 + 1;
      for (let i = startDay; i < startDay + 7; i++) {
        const btn = document.getElementById(`btn-day${i}`);
        if (btn) {
          btn.className = i === dayNum
            ? "px-2.5 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer shrink-0 bg-rose-600 text-white shadow-sm"
            : "px-2.5 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer shrink-0 text-neutral-400 hover:text-white";
        }
      }

      const lessonDataMap = {
        1: { render: () => `<div class='p-10 text-center font-bold'>Day 01 準備中</div>` },
        2: { render: () => `<div class='p-10 text-center font-bold'>Day 02 準備中</div>` },
        3: { render: () => `<div class='p-10 text-center font-bold'>Day 03 準備中</div>` },
        4: { render: () => `<div class='p-10 text-center font-bold'>Day 04 準備中</div>` },
        5: { render: () => `<div class='p-10 text-center font-bold'>Day 05 準備中</div>` },
        6: { render: () => `<div class='p-10 text-center font-bold'>Day 06 準備中</div>` },
        7: { render: () => `<div class='p-10 text-center font-bold'>Day 07 準備中</div>` },
        8: { render: () => `<div class='p-10 text-center font-bold'>Day 08 準備中</div>` },
        9: { render: () => `<div class='p-10 text-center font-bold'>Day 09 準備中</div>` },
        10: { render: () => `<div class='p-10 text-center font-bold'>Day 10 準備中</div>` },
        11: { render: () => `<div class='p-10 text-center font-bold'>Day 11 準備中</div>` },
        12: { render: () => `<div class='p-10 text-center font-bold'>Day 12 準備中</div>` },
        13: { render: () => `<div class='p-10 text-center font-bold'>Day 13 準備中</div>` },
        14: { render: () => `<div class='p-10 text-center font-bold'>Day 14 準備中</div>` },
        15: typeof day15Data !== 'undefined' ? day15Data : null,
        16: typeof day16Data !== 'undefined' ? day16Data : null,
        17: typeof day17Data !== 'undefined' ? day17Data : null,
        18: typeof day18Data !== 'undefined' ? day18Data : null,
        19: typeof day19Data !== 'undefined' ? day19Data : null,
        20: typeof day20Data !== 'undefined' ? day20Data : null,
        21: typeof day21Data !== 'undefined' ? day21Data : null
      };

      const data = lessonDataMap[dayNum];
      const root = document.getElementById('app-root');

      if (data && data.render) {
        root.innerHTML = data.render();
        lucide.createIcons();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        root.innerHTML = `<div class="max-w-4xl mx-auto px-4 py-20 text-center font-bold text-neutral-500">データが見つかりません。</div>`;
      }
    }

    function showAboutPage() {
      const root = document.getElementById('app-root');
      root.innerHTML = `<div class="max-w-4xl mx-auto px-4 py-20 text-center font-bold">About Page</div>`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderDayButtons(1);
      switchDay(1);
    });
  </script>
</body>
</html>
